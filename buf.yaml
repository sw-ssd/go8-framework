version: v1
# 僅 WKT（google/protobuf/*）由 buf 內建提供；connect 自動從 service/method 推導路由，
# 不需 connectrpc/connect extension。若日後加 google.api.http annotation 再補
#   deps:
#     - buf.build/googleapis/googleapis
breaking:
  use:
    - FILE
lint:
  use:
    - STANDARD
  # 關閉與本框架慣例衝突的風格規則：proto 置於 api/go8/v1/（目錄不強制等於套件名），
  # 且 request/response 採具描述性名稱（CreateTodoRequest 等，非 CreateRequest）。
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
