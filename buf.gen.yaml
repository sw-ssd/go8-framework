version: v1
managed:
  enabled: true
  go_package_prefix:
    default: codeberg.org/gmhafiz/go8/gen
plugins:
  # 本地安裝（go install）的 plugin 二進位，避免 BSR 限速；PATH 需含 $(go env GOPATH)/bin
  # buf 會以 "protoc-gen-<name>" 查找，故這裡填去掉前綴的後綴
  - plugin: go
    out: gen
    opt: paths=source_relative
  - plugin: connect-go
    out: gen
    opt: paths=source_relative
  # 前端 TS 產出：本地安裝的 plugin 二進位（npm i -g @bufbuild/protoc-gen-es @bufbuild/protoc-gen-connect-es），
  # PATH 需含 npm 全域 bin（$(npm prefix -g)/bin）。protoc-gen-es 產 message 型別，protoc-gen-connect-es 產 Connect service 客戶端。
  # ES plugin 不支援 paths=source_relative，故不帶 opt。
  - plugin: es
    out: web/src/gen
  - plugin: connect-es
    out: web/src/gen
