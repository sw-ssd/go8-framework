version: v1
managed:
  enabled: true
  go_package_prefix:
    default: codeberg.org/gmhafiz/go8/gen
plugins:
  # 本地安裝（go install）的 plugin 二進位，避免 BSR 限速；PATH 需含 $(go env GOPATH)/bin
  # buf 會以 "protoc-gen-<name>" 查找，故這裡填去掉前綴的後綴
  - plugin: go
    out: gen
    opt: paths=source_relative
  - plugin: connect-go
    out: gen
    opt: paths=source_relative
  # 前端 TS 產出：BSR 遠端 plugin（首次下載後快取）。
  #   - protoc-gen-es         -> buf.build/bufbuild/es           （message 型別）
  #   - protoc-gen-connect-es -> buf.build/bufbuild/connect-es   （Connect service 客戶端；配合 @connectrpc/connect-web runtime）
  - plugin: buf.build/bufbuild/es
    out: web/src/gen
    opt: paths=source_relative
  - plugin: buf.build/bufbuild/connect-es
    out: web/src/gen
    opt: paths=source_relative
